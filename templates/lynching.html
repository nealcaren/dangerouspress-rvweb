<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ROOT}}assets/atlas.css">
<link rel="stylesheet" href="{{ROOT}}assets/lynching.css">
<link rel="stylesheet" href="{{ROOT}}assets/theme.css">
<div class="wrap">
<header class="top">
 <p class="nav"><a href="{{ROOT}}atlas/">August atlas</a> · <a href="{{ROOT}}compare/">August inventory comparison</a></p>
 <h1 id="title">{{TITLE}}</h1>
 <div id="dek"></div>
 <div class="tally" id="tally"></div>
</header>
<div class="grid">
 <div class="figs">
  <div class="legend" id="legend" role="group" aria-label="Show or hide by comparison"></div>
  <div class="map" id="map"></div>
  <p class="cap" id="mapcap"></p>
  <div class="tl" id="tl"></div>
  <p class="cap" id="tlcap"></p>
 </div>
 <aside class="side" id="side" aria-live="polite"><div class="in" id="sidein"></div></aside>
</div>
<section class="ctable" id="ctable" aria-labelledby="ct-h">
 <h2 id="ct-h">Inventory victims beside our records</h2>
 <p class="cap" id="ct-cap"></p>
 <div class="filters" id="ct-filters"></div>
 <div class="tablewrap"><table id="ct"><thead></thead><tbody></tbody></table></div>
</section>
</div>
<div class="tip" id="tip" hidden></div>
<script src="{{ROOT}}assets/lynching.js" defer></script>
